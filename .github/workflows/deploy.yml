name: Deploy SMART FARM 2.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: smart-farm-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/engine.js
          node --check src/data.js
          node --check src/learning.js
      - name: Check required files
        run: |
          test -f index.html
          test -f src/styles.css
          test -f src/upgrade.css
          test -f src/learning.js
          grep -q 'src/app.js' index.html
      - name: Unit tests
        run: |
          if [ -f tests/engine.test.mjs ]; then node --test tests/engine.test.mjs; else echo 'No engine.test.mjs found'; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
